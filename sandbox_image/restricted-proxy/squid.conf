# Allowlisting forward proxy used by sandbox network mode "restricted".
# Only lets sandbox containers reach PyPI, nothing else — no general internet,
# no LAN access. Extend allowed_dst if a specific run needs another host, but
# treat every addition as widening a guardrail, not a routine config tweak.

http_port 3128

# Docker's default bridge subnets (docker0 + user-defined bridges typically
# fall in 172.16.0.0/12). This is what actually restricts who may use the
# proxy — see the note in docker-compose.yml about why the port itself is
# published on all interfaces.
acl docker_nets src 172.16.0.0/12

acl allowed_dst dstdomain .pypi.org .files.pythonhosted.org

http_access allow docker_nets allowed_dst
http_access deny all

via off
forwarded_for delete
